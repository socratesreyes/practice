name: Broken Production Pipeline

on:
  workflow_dispatch:
  #push:
  #  branches: [vs-code]

jobs:
  compile-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Artifact
        run: |
          mkdir out
          echo "Version 1.2.3" > out/app.bin

      - name: Save Application
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: out/app.bin

  deploy-staging:
    runs-on: ubuntu-latest
    needs: compile-code

    steps:
      - name: Get App
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: current-release/

      - name: Push to Cloud
        env:
          DEPLOY_PASSWORD: ${{ vars.MY_SECRET_PASSWORD }}
        run: |
          if [ -z "$DEPLOY_PASSWORD" ]; then
            echo "Deployment password is not configured."
            exit 1
          fi

          echo "Deploying to cloud..."
          echo "Deployment successful!"
