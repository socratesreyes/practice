name: Python-API-merge-main-branch

on:
  push:
    branches: [vs-code]

jobs:
  run-python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q
