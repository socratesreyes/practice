name: Test Secret Pipeline

on:
  pull_request:
    branches:
      - vs-code

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Secret Presence Safely
        env:
          MY_PASSWORD: ${{ secrets.MY_SECRET_PASSWORD }}
        run: |
          # 1. Pre-flight empty check
          if [ -z "$MY_PASSWORD" ]; then
            echo "::error::Secret is completely missing or empty!"
            exit 1
          fi

          # 2. DevOps Safe Test: Count the characters in the password
          # This proves the secret is loaded in RAM without printing the text!
          CHARACTER_COUNT=$(echo -n "$MY_PASSWORD" | wc -c)

          echo "Success! The secret is loaded in memory."
          echo "The secret is $CHARACTER_COUNT characters long."
